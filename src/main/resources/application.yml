spring:
  application:
    name: booking-calendar-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/booking_calendar?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          google-calendar:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/calendar.events.owned

calendar:
  token-encryption-key: ${CALENDAR_TOKEN_ENCRYPTION_KEY:}
  http:
    connect-timeout: 3s
    read-timeout: 5s
  sync:
    worker-enabled: ${CALENDAR_SYNC_WORKER_ENABLED:true}
    poll-interval-ms: 5000
    max-attempts: 5
    initial-backoff: 30s
    max-backoff: 15m
    lease-duration: 60s
    reconcile-interval: 5m
    batch-size: 20

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
